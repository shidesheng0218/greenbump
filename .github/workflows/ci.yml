name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  smoke-test:
    name: Smoke test real toolchains
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ecosystem:
          - { name: npm, setup: "npm install -g npm@latest", detect: "npm outdated --json || true" }
          - { name: pip, setup: "pip install --upgrade pip", detect: "pip list --outdated --format=json" }
          - { name: cargo, setup: "rustup update stable", detect: "cargo --version" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        if: matrix.ecosystem.name == 'pip'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Rust
        if: matrix.ecosystem.name == 'cargo'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup npm ecosystem
        if: matrix.ecosystem.name == 'npm'
        run: ${{ matrix.ecosystem.setup }}

      - name: Setup pip ecosystem
        if: matrix.ecosystem.name == 'pip'
        run: ${{ matrix.ecosystem.setup }}

      - name: Setup cargo ecosystem
        if: matrix.ecosystem.name == 'cargo'
        run: ${{ matrix.ecosystem.setup }}

      - name: Run detect command
        run: ${{ matrix.ecosystem.detect }}

      - name: Build greenbump CLI
        run: |
          npm ci
          npm run build

      - name: Test greenbump --list-ecosystems
        run: node dist/cli.js --list-ecosystems | grep -q "${{ matrix.ecosystem.name }}"
