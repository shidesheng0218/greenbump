name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build:action
      # action-dist/index.cjs is committed (GitHub Actions runs it straight from the
      # repo, not from npm) — if this tag's build doesn't match what's checked in, the
      # author forgot to rebuild+commit it before tagging. Fail loud instead of quietly
      # publishing an npm package whose action-dist is stale relative to its own source.
      - run: git diff --exit-code action-dist/
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Use the tag's CHANGELOG.md section as the release body instead of the
      # generic template — keeps hand-written notes from being overwritten.
      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## .*${VERSION//./\\.}/{f=1;next} /^## /{if(f)exit} f" CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md for details." > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
