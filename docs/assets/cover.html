<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>greenbump Cover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰圆圈 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            background: white;
            top: -200px;
            left: -200px;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            background: white;
            bottom: -150px;
            right: -150px;
        }

        .circle-3 {
            width: 200px;
            height: 200px;
            background: white;
            top: 50%;
            right: 100px;
        }

        .content {
            z-index: 10;
            text-align: center;
        }

        .logo {
            font-size: 140px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 80px;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: -2px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 38px;
            margin-bottom: 50px;
            opacity: 0.95;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .features {
            display: flex;
            gap: 50px;
            font-size: 26px;
            font-weight: 600;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .feature-icon {
            font-size: 32px;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 18px;
            opacity: 0.8;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    <div class="bg-circle circle-3"></div>

    <div class="content">
        <div class="logo">🌱</div>
        <div class="title">greenbump</div>
        <div class="subtitle">让 AI 自动修复依赖升级的破坏性变更</div>
        <div class="features">
            <div class="feature">
                <span class="feature-icon">🤖</span>
                <span>AI 驱动</span>
            </div>
            <div class="feature">
                <span class="feature-icon">⚡</span>
                <span>30 秒修复</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🌍</span>
                <span>20+ 生态</span>
            </div>
        </div>
    </div>

    <div class="footer">FROM RED PR TO GREEN PR</div>
</body>
</html>
